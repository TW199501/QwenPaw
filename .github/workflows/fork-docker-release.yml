# Fork-only: build the QwenPaw Docker image and push it to THIS fork's GitHub
# Container Registry (ghcr.io/<owner>/qwenpaw). It authenticates with the
# built-in GITHUB_TOKEN, so it needs none of the upstream DockerHub / Aliyun
# secrets and never touches the author's registries.
#
# Trigger: push a tag matching v* (e.g. v2.0.1) to auto-publish, or run it
# manually from Actions -> Fork Docker Release (GHCR) -> Run workflow.

name: Fork Docker Release (GHCR)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v2.0.1). Defaults to v<project version>."
        required: false
        type: string
      latest:
        description: "Also update the :latest tag"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name and tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            version="${{ inputs.tag }}"
          else
            version="v${{ steps.version.outputs.version }}"
          fi
          # ghcr.io image names must be lowercase
          image=$(echo "ghcr.io/${{ github.repository_owner }}/qwenpaw" | tr '[:upper:]' '[:lower:]')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Image: ${image}:${version}"

      - name: Build and push image
        env:
          QWENPAW_DISABLED_CHANNELS: "imessage"
        run: |
          image="${{ steps.vars.outputs.image }}"
          version="${{ steps.vars.outputs.version }}"
          tags="-t ${image}:${version}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.latest }}" = "true" ]; then
            tags="${tags} -t ${image}:latest"
          fi
          docker buildx build --platform linux/amd64 \
            -f deploy/Dockerfile \
            --build-arg QWENPAW_DISABLED_CHANNELS="${QWENPAW_DISABLED_CHANNELS}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            ${tags} --push .
