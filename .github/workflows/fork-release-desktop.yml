# Fork-only: build the Windows desktop installer and publish it as a GitHub
# Release on THIS fork. It does NOT sign artifacts or touch OSS / PyPI / Docker
# and needs none of the upstream secrets - it only attaches the NSIS installer
# to a Release on the fork itself.
#
# Trigger: push a tag matching v* (e.g. v2.0.1) to auto-publish, or run it
# manually from Actions -> Fork Desktop Release (Windows) -> Run workflow.

name: Fork Desktop Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.1). Defaults to v<project version>."
        required: false
        type: string
      prerelease:
        description: "Mark the release as a prerelease"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      - name: Build Tauri Windows package
        shell: pwsh
        env:
          # Authenticate the python-build-standalone release lookup in
          # stage_python_runtime.py to avoid anonymous API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/pack-tauri/build_win_pyinstaller.ps1

      - name: Stage Tauri Windows installer
        id: stage
        shell: pwsh
        run: |
          $installer = Get-ChildItem "console/src-tauri/target/release/bundle/nsis/*.exe" |
            Select-Object -First 1
          if (-not $installer) { throw "No Tauri Windows installer found" }
          $target = "dist/QwenPaw-Tauri-${{ steps.version.outputs.version }}-Windows-setup.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Force $installer.FullName $target
          "path=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Staged: $target"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-windows-installer
          path: ${{ steps.stage.outputs.path }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: QwenPaw Desktop ${{ steps.tag.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: ${{ steps.stage.outputs.path }}
          fail_on_unmatched_files: true
